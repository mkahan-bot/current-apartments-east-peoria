<!--
  "Ask Katie" embeddable form — The Current Apartments
  Paste this whole block into any page (ChatGPT Sites, the static thecurrent500.com build, etc.).
  It posts JSON to ASK_KATIE_ENDPOINT below. Default: the live site's /api/questions route,
  which stores the question and emails it to jd@geula.ai via the Apps Script bridge.
  It also works with any JSON form backend (e.g. https://formspree.io/f/XXXXXXX).
-->
<section id="ask-katie" class="ak">
  <style>
    .ak{--ak-ink:#102d35;--ak-muted:#4f6b70;--ak-line:#cad5d2;--ak-accent:#239bb5;--ak-dark:#06233a;font-family:Arial,Helvetica,sans-serif;color:var(--ak-ink);max-width:640px;margin:0 auto;padding:32px 16px}
    .ak *{box-sizing:border-box}
    .ak h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.05;margin:6px 0 12px}
    .ak .ak-eyebrow{color:var(--ak-accent);font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
    .ak p{color:var(--ak-muted);line-height:1.6;margin:0 0 18px}
    .ak form{display:grid;gap:16px;background:#fff;padding:clamp(20px,5vw,40px);box-shadow:0 18px 50px rgba(8,35,56,.12)}
    .ak .ak-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .ak label{display:grid;gap:6px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#4b6468}
    .ak label small{font-weight:500;text-transform:none;color:#87999b}
    .ak input,.ak textarea{width:100%;border:1px solid var(--ak-line);background:#fbfcfa;padding:12px 13px;font:inherit;font-size:16px;color:var(--ak-ink);letter-spacing:0;text-transform:none}
    .ak input:focus,.ak textarea:focus{outline:2px solid rgba(35,155,181,.35);border-color:var(--ak-accent)}
    .ak .ak-consent{grid-template-columns:18px 1fr;align-items:start;font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;line-height:1.5}
    .ak .ak-consent input{width:16px;height:16px;margin:2px 0 0;padding:0}
    .ak .ak-hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
    .ak button{min-height:48px;border:0;background:var(--ak-dark);color:#fff;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
    .ak button:disabled{opacity:.65;cursor:wait}
    .ak .ak-error{margin:0;padding:12px;background:#fff1f1;color:#8c2b2b;font-size:13px}
    .ak .ak-done{background:#fff;padding:40px;box-shadow:0 18px 50px rgba(8,35,56,.12)}
    .ak a{color:var(--ak-accent);font-weight:700}
    @media (max-width:520px){.ak .ak-row{grid-template-columns:1fr}}
  </style>

  <span class="ak-eyebrow">Not ready to apply or tour?</span>
  <h2>Ask Katie anything.</h2>
  <p>Send a question to Katie on our leasing team and get an answer by email. No application, no appointment. Prefer to talk? Call <a href="tel:+13092105904">309-210-5904</a>.</p>

  <form id="ak-form" novalidate>
    <div class="ak-row">
      <label>First name<input name="firstName" autocomplete="given-name" required maxlength="80"></label>
      <label>Last name<input name="lastName" autocomplete="family-name" required maxlength="80"></label>
    </div>
    <label>Email<input name="email" type="email" autocomplete="email" required maxlength="180"></label>
    <label>Phone <small>(optional)</small><input name="phone" type="tel" autocomplete="tel" maxlength="40"></label>
    <label>Your question<textarea name="question" rows="5" required minlength="3" maxlength="2000" placeholder="e.g. Are cats allowed? What utilities are included?"></textarea></label>
    <label class="ak-hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
    <label class="ak-consent"><input name="consent" type="checkbox" value="yes" required><span>I agree that The Current Apartments may reply to my question and follow up about leasing by email, or by phone if I provided one.</span></label>
    <p class="ak-error" id="ak-error" role="alert" hidden></p>
    <button type="submit">Send my question</button>
  </form>
  <div class="ak-done" id="ak-done" hidden>
    <h2>Question sent.</h2>
    <p>Thanks for reaching out. Katie will reply to the email you gave us.</p>
  </div>

  <script>
  (function () {
    var ASK_KATIE_ENDPOINT = "https://currentapartmentseastpeoria.com/api/questions";
    var form = document.getElementById("ak-form");
    var err = document.getElementById("ak-error");
    var done = document.getElementById("ak-done");
    var UTM = ["utm_source","utm_medium","utm_campaign","utm_content","utm_term","gclid","fbclid"];

    function fail(msg) { err.textContent = msg; err.hidden = false; }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      err.hidden = true;
      var d = new FormData(form);
      var get = function (k) { return String(d.get(k) || "").trim(); };
      if (!get("firstName") || !get("lastName")) return fail("Please share your first and last name.");
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(get("email"))) return fail("Please enter a valid email address so Katie can reply.");
      if (get("phone") && get("phone").replace(/\D/g, "").length < 10) return fail("Please check your phone number, or leave it blank.");
      if (get("question").length < 3) return fail("Please type your question.");
      if (get("consent") !== "yes") return fail("Please confirm that we may reply to you.");

      var params = new URLSearchParams(location.search), utm = {};
      UTM.forEach(function (k) { if (params.get(k)) utm[k] = params.get(k); });

      var btn = form.querySelector("button");
      btn.disabled = true; btn.textContent = "Sending…";
      fetch(ASK_KATIE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          firstName: get("firstName"), lastName: get("lastName"), email: get("email"),
          phone: get("phone"), question: get("question"), consent: get("consent"),
          website: get("website"), pageUrl: location.href, referrer: document.referrer, utm: utm
        })
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          if (!r.ok) throw new Error(body.error || "We could not send your question.");
          form.hidden = true; done.hidden = false;
          if (window.gtag) window.gtag("event", "generate_lead", { form_name: "ask_katie" });
        });
      }).catch(function (e2) {
        fail((e2 && e2.message) || "We could not send your question. Please call 309-210-5904.");
        btn.disabled = false; btn.textContent = "Send my question";
      });
    });
  })();
  </script>
</section>
